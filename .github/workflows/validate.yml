name: Repository Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python scripts/validate_core.py

      - name: Install contract test dependencies
        run: python -m pip install -r scripts/requirements-contracts.txt

      - name: Validate runtime contract fixtures
        run: python scripts/runtime_contracts.py

      - name: Test runtime contracts
        run: python -m unittest discover -s tests -v
